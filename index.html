<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <title>Aither Notes</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand"><div class="logo">A</div><div><b>Aither</b><span>Notes</span></div></div>
      <button class="new-note" id="newNote">＋ New note</button>
      <nav>
        <button class="nav active" data-view="all">📝 <span>All notes</span><em id="allCount">0</em></button>
        <button class="nav" data-view="pinned">📌 <span>Pinned</span><em id="pinnedCount">0</em></button>
        <button class="nav" data-view="favorites">⭐ <span>Favorites</span><em id="favoriteCount">0</em></button>
      </nav>
      <div class="side-title">Folders</div>
      <button class="folder active" data-folder="All">All notes</button>
      <button class="folder" data-folder="Personal">Personal</button>
      <button class="folder" data-folder="School">School</button>
      <button class="folder" data-folder="Ideas">Ideas</button>
      <button class="add-folder" id="addFolder">＋ Add folder</button>
      <div class="sidebar-bottom"><span>Saved locally</span><span class="dot"></span></div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="mobile-brand"><div class="logo">A</div><b>Aither Notes</b></div>
        <div class="search"><span>⌕</span><input id="search" placeholder="Search notes…" autocomplete="off"><kbd>⌘ K</kbd></div>
        <button class="icon-btn" id="theme" title="Toggle theme">☾</button>
      </header>

      <section class="content">
        <div class="heading"><div><p class="eyebrow" id="viewLabel">YOUR NOTES</p><h1 id="title">All notes</h1></div><button class="sort" id="sort">Updated ↓</button></div>
        <div id="notes" class="notes"></div>
        <div id="empty" class="empty hidden"><div class="empty-icon">✦</div><h2>No notes here</h2><p>Create a note and it will appear here.</p><button class="new-note" id="emptyNew">Create a note</button></div>
      </section>
    </main>

    <section class="editor hidden" id="editor">
      <div class="editor-head"><button class="back" id="closeEditor">←</button><span>Editing note</span><div class="editor-actions"><button id="pin" title="Pin">📌</button><button id="favorite" title="Favorite">☆</button><button id="delete" title="Delete">🗑</button></div></div>
      <input class="note-title" id="noteTitle" placeholder="Untitled note">
      <textarea id="noteBody" placeholder="Start writing…"></textarea>
      <div class="editor-foot"><select id="noteFolder"><option>All</option><option>Personal</option><option>School</option><option>Ideas</option></select><span id="saveStatus">Saved locally</span></div>
    </section>
  </div>
  <script src="app.js"></script>
</body>
</html>
