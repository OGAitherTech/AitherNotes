<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6d5dfc">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Aither Notes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<title>Aither Notes</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
<aside class="sidebar">
<div class="brand"><div class="logo">A</div><div><b>Aither Notes</b><span>Simple. Private. Yours.</span></div></div>
<button class="new-note" id="newNote">New note</button>
<nav>
<button class="nav active" data-view="all"><span>All notes</span><em id="allCount">0</em></button>
<button class="nav" data-view="pinned"><span>Pinned</span><em id="pinnedCount">0</em></button>
<button class="nav" data-view="favorites"><span>Favorites</span><em id="favoriteCount">0</em></button>
</nav>
<div class="side-title">Folders</div>
<button class="folder active" data-folder="All">All notes</button>
<button class="folder" data-folder="Personal">Personal</button>
<button class="folder" data-folder="School">School</button>
<button class="folder" data-folder="Ideas">Ideas</button>
<div class="sidebar-bottom">Saved on this device <span class="dot"></span></div>
</aside>
<main class="main">
<header class="topbar">
<div class="mobile-brand"><div class="logo">A</div><b>Aither Notes</b></div>
<div class="search"><span>⌕</span><input id="search" placeholder="Search notes" autocomplete="off"><kbd>⌘ K</kbd></div>
<button class="icon-btn" id="theme" aria-label="Toggle dark mode">Dark</button>
</header>
<section class="content">
<div class="heading"><div><p class="eyebrow" id="viewLabel">YOUR NOTES</p><h1 id="title">All notes</h1></div><button class="sort" id="sort">Updated ↓</button></div>
<div id="notes" class="notes"></div>
<div id="empty" class="empty hidden"><div class="empty-icon">A</div><h2>No notes here</h2><p>Create your first note to get started.</p><button class="new-note" id="emptyNew">Create a note</button></div>
</section>
</main>
<nav class="mobile-nav"><button class="mobile-nav-btn active" data-view="all"><span>Notes</span></button><button class="mobile-nav-btn" data-view="pinned"><span>Pinned</span></button><button class="mobile-nav-btn" data-view="favorites"><span>Favorites</span></button><button class="mobile-nav-btn" id="mobileNew"><span>New</span></button></nav>
<section class="editor hidden" id="editor">
<div class="editor-head"><button class="back" id="closeEditor" aria-label="Close">Back</button><span>Editing note</span><div class="editor-actions"><button id="pin" title="Pin">Pin</button><button id="favorite" title="Favorite">Favorite</button><button id="delete" title="Delete">Delete</button></div></div>
<input class="note-title" id="noteTitle" placeholder="Untitled note" maxlength="120">
<textarea id="noteBody" placeholder="Start writing..." autocapitalize="sentences" spellcheck="true"></textarea>
<div class="editor-foot"><select id="noteFolder"><option>Personal</option><option>School</option><option>Ideas</option></select><span id="saveStatus">Saved</span></div>
</section>
</div>
<script src="app.js"></script>
<script>if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');</script>
</body>
</html>
